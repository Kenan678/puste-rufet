<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rüfət və Püstə — Toy şəkilləri</title>
<meta property="og:title" content="Rüfət və Püstə — Toy şəkilləri">
<meta property="og:description" content="Toyda çəkdiyiniz şəkilləri bizimlə bölüşün">
<meta property="og:image" content="https://kenan678.github.io/puste-rufet/og-image.jpg?v=2">
<meta name="theme-color" content="#F6EFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=10">
<style>
  .photo-hero { padding: 84px 0 28px; text-align: center; }
  .photo-hero .names { font-size: clamp(44px, 13vw, 64px); margin: 14px 0 6px; }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .album-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 40px; }
  .album-head h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--emerald); }
  .back { display: inline-block; margin: 36px 0 70px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
<div class="topbar">
  <div class="lang-switch" role="group" aria-label="Language">
    <button data-lang="az">AZ</button><button data-lang="en">EN</button><button data-lang="ru">RU</button>
  </div>
</div>

<div class="wrap">
  <header class="photo-hero">
    <p class="eyebrow" data-i18n="photos"></p>
    <h1 class="names" id="names"></h1>
    <p class="muted" id="date"></p>
  </header>

  <div class="upload-zone">
    <div class="field"><input class="input" id="who" maxlength="60" data-i18n-ph="your_name" autocomplete="name"></div>
    <input type="file" id="file" accept="image/*" multiple>
    <label for="file" class="btn gold block" id="pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span data-i18n="upload"></span>
    </label>
    <p class="muted" style="font-size:13px;margin-top:10px" data-i18n="upload_hint"></p>
    <div class="progress" id="prog"><i></i></div>
    <div class="notice" id="msg" role="status"></div>
  </div>

  <div class="album-head"><h2 data-i18n="album"></h2><span class="muted" id="count"></span></div>
  <div class="grid" id="grid"></div>
  <p class="muted center" id="empty" style="margin-top:18px" hidden data-i18n="album_empty"></p>

  <a class="back" href="index.html?skip" id="back">← <span data-i18n="back"></span></a>
</div>

<div class="lightbox" id="lb"><button class="x" id="lbx" aria-label="Close">×</button><img id="lbimg" alt=""></div>

<script src="config.js?v=10"></script>
<script src="assets/core.js?v=10"></script>
<script>
(function () {
  const T = TOY, W = T.W, $ = id => document.getElementById(id);
  let photos = []; // {url, thumb}

  function head() {
    $("names").innerHTML = `${T.esc(T.first)} <span style="color:var(--gold);font-style:normal">&amp;</span> ${T.esc(T.second)}`;
    $("date").textContent = `${T.longDate(W.date)}`;
    document.title = `${T.first} & ${T.second} — ${T.t("photos")}`;
  }
  const g = (T.params.get("g") || "").trim();
  if (g) $("who").value = g;
  try { const saved = localStorage.getItem("toy_who"); if (saved && !g) $("who").value = saved; } catch (e) {}

  function renderGrid() {
    $("grid").innerHTML = photos.map((p, i) => `<button data-i="${i}" aria-label="Foto ${i + 1}"><img loading="lazy" src="${T.esc(p.thumb || p.url)}" alt=""></button>`).join("");
    $("empty").hidden = photos.length > 0;
    $("count").textContent = photos.length ? photos.length : "";
  }
  $("grid").addEventListener("click", e => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    $("lbimg").src = photos[+b.dataset.i].url; $("lb").classList.add("show");
  });
  $("lbx").onclick = () => $("lb").classList.remove("show");
  $("lb").addEventListener("click", e => { if (e.target.id === "lb") $("lb").classList.remove("show"); });

  async function load() {
    const sb = await T.sb().catch(() => null);
    if (!sb) return renderGrid();
    const { data, error } = await sb.from("photos").select("path,created_at").order("created_at", { ascending: false }).limit(1000);
    if (!error) photos = (data || []).map(r => ({ url: T.photoUrl(r.path) }));
    renderGrid();
  }

  /* Şəkli brauzerdə kiçildib JPEG-ə çevirir (yaddaşa qənaət) */
  async function compress(file) {
    const max = W.photoMaxSide || 1800, q = W.photoQuality || .82;
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) {
      bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
    }
    const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", q));
  }

  function note(kind, text) { const m = $("msg"); m.className = `notice show ${kind}`; m.textContent = text; }

  $("file").addEventListener("change", async e => {
    const files = [...e.target.files].filter(f => f.type.startsWith("image/")).slice(0, 30);
    e.target.value = "";
    if (!files.length) return;
    const who = $("who").value.trim().slice(0, 60);
    try { localStorage.setItem("toy_who", who); } catch (e) {}
    const sb = await T.sb().catch(() => null);
    const bar = $("prog"); bar.classList.add("show");
    $("pick").setAttribute("aria-disabled", "true"); $("pick").style.pointerEvents = "none";
    let done = 0, ok = 0;
    note("ok", T.t("uploading", { done: 0, total: files.length }));
    for (const f of files) {
      try {
        const blob = await compress(f);
        if (sb) {
          const path = `${new Date().toISOString().slice(0, 10)}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
          const up = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
          if (up.error) throw up.error;
          const ins = await sb.from("photos").insert({ path, uploader: who || null });
          if (ins.error) throw ins.error;
          photos.unshift({ url: T.photoUrl(path) });
        } else {
          photos.unshift({ url: URL.createObjectURL(blob) });
        }
        ok++;
      } catch (err) { console.error(err); }
      done++;
      bar.firstChild.style.width = (done / files.length * 100) + "%";
      note("ok", T.t("uploading", { done, total: files.length }));
      renderGrid();
    }
    $("pick").removeAttribute("aria-disabled"); $("pick").style.pointerEvents = "";
    setTimeout(() => { bar.classList.remove("show"); bar.firstChild.style.width = 0; }, 800);
    if (ok) note("ok", T.t("uploaded", { n: ok })); else note("err", T.t("err"));
  });

  T.initLangSwitch();
  document.addEventListener("langchange", head);
  head(); load();
  if (T.isDemo) { const b = document.createElement("div"); b.className = "demo-bar"; b.dataset.i18n = "demo"; b.textContent = T.t("demo"); document.body.appendChild(b); }
})();
</script>
</body>
</html>
